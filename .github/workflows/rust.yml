name: Rust

# 強制力の序列で層 1（無条件に効く）。git hooks（層 2）と Claude Code hooks（層 3）は
# 実行環境によっては同時に抜けるため、ここが唯一の無条件のゲートになる
# （harness/githooks/README.md「配線の穴と、それを誰が塞ぐか」）。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # tomllib を使うため、ランナーの既定 Python に依存させない。
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: 最低対応 Rust ツールチェーン
        # 宣言と検査する版のずれを防ぐ。minor 指定でも最初の patch を検査する。
        run: |
          rust_version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["package"]["rust-version"]
          print(version + ".0" if version.count(".") == 1 else version)
          PY
          )"
          rustup toolchain install "$rust_version" --profile minimal --no-self-update
          echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"

      - name: cargo check (MSRV)
        run: cargo check --locked --all-targets

  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      # アクションは commit hash で固定する。
      #
      # Why: タグは動かせるので、`@v5` のままだと同じ設定でも別のコードが走りうる。
      # ここは無条件のゲートなので、何が走るかを固定できないと検査そのものが信用できない。
      # 更新するときは hash とコメントの版を両方直す。
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Why not（dtolnay/rust-toolchain）: 公式ではないため。
      # ランナーには rustup が入っているので、直接呼べば足りる。
      - name: Rust ツールチェーン
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy
          cargo --version
          cargo fmt --version
          cargo clippy --version

      # Why not（キャッシュ）: 依存が少なく、ビルドからテストまで数秒で終わる。
      # `actions/cache` を足しても縮む時間より、キー設計と復元漏れの面倒のほうが大きい。
      # 遅くなってから入れる。

      # 1 つずつ独立したステップにする。&& で連ねると途中の出力が流れて
      # 末尾しか見えず、どの検査で落ちたのかを読み違える。
      - name: cargo fmt
        run: bash harness/githooks/lib/rust-checks.sh fmt

      - name: cargo clippy
        run: bash harness/githooks/lib/rust-checks.sh clippy

      - name: cargo doc
        run: bash harness/githooks/lib/rust-checks.sh doc

      - name: cargo test
        run: bash harness/githooks/lib/rust-checks.sh test

  harness:
    # 層 3 のフックそのものは CI では発火しないが、判定が壊れたことはここでしか
    # 無条件に気づけない。壊れたまま入ると、push を取りこぼすか、push でないコマンドまで止める。
    # 検査の並びは harness/githooks/pre-push が持つ（二重管理にしない）。cargo の 4 つは
    # check ジョブと重なるが、pre-push の結果の行が「すべて通過」になることまでをここで見る。
    name: ハーネスの検査（pre-push と同じもの）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # red-commits.yml も同じ入れ方で pre-push を走らせる。ここを変えたらそちらも合わせる。
      - name: Rust ツールチェーン
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt clippy

      # PRE_PUSH_REQUIRE_ALL=1: 道具が無くて飛ばした検査も失敗に数える。CI で飛ばしたまま緑にしない。
      - name: pre-push
        env:
          PRE_PUSH_REQUIRE_ALL: "1"
        run: bash harness/githooks/pre-push
