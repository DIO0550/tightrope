[package]
name = "tightrope"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "モジュール間の結合を統合強度・距離・変動性から測り、バランスを判定する CLI"
repository = "https://github.com/DIO0550/tightrope"
license = "MIT"

# 依存を足すときは素の `cargo add` ではなく harness/deps/resolve.sh を通す
# (AGENTS.md「依存の更新は cooldown を通す」)。
[dependencies]
toml = "1.2.0"

# 本番コードでの unwrap / expect の禁止は、規約の文ではなくツールで落とす。
# テストコード内は clippy.toml の allow-unwrap-in-tests / allow-expect-in-tests で許可する
# (rules/coding.md「エラーと不在の表現」/ rules/testing.md「テスト内の unwrap / expect」)。
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
