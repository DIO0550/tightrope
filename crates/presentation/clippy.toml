# 禁止する理由は rules/coding.md「I/O を持ってよい場所」、このファイルへ写す決まりは根の clippy.toml の冒頭。
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-macros = [
  "std::print",
  "std::println",
  "std::eprint",
  "std::eprintln",
  "std::dbg",
]
disallowed-methods = [
  "std::fs::read",
  "std::fs::read_to_string",
  "std::fs::write",
  "std::fs::remove_file",
  "std::fs::metadata",
  "std::fs::symlink_metadata",
  "std::fs::rename",
  "std::fs::copy",
  "std::fs::hard_link",
  "std::fs::soft_link",
  "std::fs::read_link",
  "std::fs::canonicalize",
  "std::fs::create_dir",
  "std::fs::create_dir_all",
  "std::fs::remove_dir",
  "std::fs::remove_dir_all",
  "std::fs::read_dir",
  "std::fs::set_permissions",
  "std::fs::exists",
  "std::path::Path::metadata",
  "std::path::Path::symlink_metadata",
  "std::path::Path::canonicalize",
  "std::path::Path::read_link",
  "std::path::Path::read_dir",
  "std::path::Path::exists",
  "std::path::Path::try_exists",
  "std::path::Path::is_file",
  "std::path::Path::is_dir",
  "std::path::Path::is_symlink",
  "std::os::unix::fs::symlink",
  "std::os::unix::fs::chown",
  "std::os::unix::fs::fchown",
  "std::os::unix::fs::lchown",
  "std::os::unix::fs::chroot",
  "std::io::stdin",
  "std::io::stdout",
  "std::io::stderr",
  "std::io::IsTerminal::is_terminal",
  "std::env::current_dir",
  "std::env::set_current_dir",
  "std::env::vars",
  "std::env::vars_os",
  "std::env::var",
  "std::env::var_os",
  "std::env::set_var",
  "std::env::remove_var",
  "std::env::split_paths",
  "std::env::join_paths",
  "std::env::home_dir",
  "std::env::temp_dir",
  "std::env::current_exe",
  "std::env::args",
  "std::env::args_os",
  "std::net::ToSocketAddrs::to_socket_addrs",
]
disallowed-types = [
  "std::fs::File",
  "std::fs::OpenOptions",
  "std::fs::DirBuilder",
  "std::fs::ReadDir",
  "std::fs::DirEntry",
  "std::fs::Metadata",
  "std::fs::FileType",
  "std::fs::Permissions",
  "std::fs::FileTimes",
  "std::fs::TryLockError",
  "std::process::Command",
  "std::io::Stdin",
  "std::io::StdinLock",
  "std::io::Stdout",
  "std::io::StdoutLock",
  "std::io::Stderr",
  "std::io::StderrLock",
  "std::io::IsTerminal",
  "std::env::Vars",
  "std::env::VarsOs",
  "std::env::VarError",
  "std::env::SplitPaths",
  "std::env::JoinPathsError",
  "std::env::Args",
  "std::env::ArgsOs",
  "std::net::TcpStream",
  "std::net::TcpListener",
  "std::net::Incoming",
  "std::net::UdpSocket",
  "std::net::Shutdown",
  "std::net::ToSocketAddrs",
  "std::os::unix::net::UnixStream",
  "std::os::unix::net::UnixListener",
  "std::os::unix::net::UnixDatagram",
  "std::os::unix::net::Incoming",
  "std::os::unix::net::SocketAddr",
]
